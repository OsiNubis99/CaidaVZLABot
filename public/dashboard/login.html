  <title>Caída — Abrime en Telegram</title>

<body class="login-page">
  <main class="login-card">
    <h1>Abrime desde Telegram</h1>
    <p>
      Esta es una Telegram Web App. Para usarla:
    </p>
    <ol>
      <li>Abrí Telegram</li>
      <li>Buscá <strong>@CaidaVZLABot</strong> y entrá al chat</li>
      <li>Tocá el botón <strong>📊 Mi cuenta</strong> al lado del input (📎)</li>
    </ol>
    <p class="muted">
      Si la abrís en un browser normal vas a ver solo este mensaje porque
      Telegram no inyecta tus credenciales acá afuera.
    </p>
  </main>
