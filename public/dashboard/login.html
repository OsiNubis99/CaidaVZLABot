<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CaidaVZLA — Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <h1>CaidaVZLA Admin</h1>
    <p>
      Esta página requiere un magic link generado por el bot.
    </p>
    <ol>
      <li>Abrí Telegram</li>
      <li>Escribile al bot <strong>/dashboard_login</strong></li>
      <li>Tocá el link que te DM</li>
    </ol>
    <p class="muted">
      El link vence en 5 minutos y solo funciona si tu Telegram ID está
      en <code>ADMIN_USER_IDS</code>.
    </p>
  </main>
</body>
</html>
