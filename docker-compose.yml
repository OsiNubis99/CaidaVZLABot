services:
  postgres:
    image: postgres:15-alpine
    container_name: caida-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - caida-pgdata:/var/lib/postgresql/data
      - ./docs/DB.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: caida-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      POSTGRESQL_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      PGSSL: "false"
      PORT: "3000"
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STATS_TOKEN: ${STATS_TOKEN:-}

  # Daily pg_dump retained on its own volume. Retention: 14 daily / 4 weekly / 3 monthly.
  # Image is maintained and pinned to the postgres major version we use.
  backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: caida-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      HEALTHCHECK_PORT: 8080
    volumes:
      - caida-backups:/backups

volumes:
  caida-pgdata:
  caida-backups:
