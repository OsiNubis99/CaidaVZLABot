services:
  postgres:
    image: postgres:15-alpine
    container_name: caida-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - caida-pgdata:/var/lib/postgresql/data
      - ./docs/DB.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: caida-bot
    restart: unless-stopped
    ports:
      # Expose only on loopback — nginx (same host) proxies to here.
      # Host 127.0.0.1:3010 → container 3000. Picked 3010 because the
      # server already has another service on host:3000.
      - "127.0.0.1:3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      POSTGRESQL_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      PGSSL: "false"
      PORT: "3000"
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STATS_TOKEN: ${STATS_TOKEN:-}
      # Opt-in verbose decision trace for the pro CPU. Set in .env when
      # debugging a reported bad pick; leave off in steady state.
      DEBUG_CPU_DECISIONS: ${DEBUG_CPU_DECISIONS:-}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-}
      DASHBOARD_PATH: ${DASHBOARD_PATH:-}

volumes:
  caida-pgdata:
