# /etc/nginx/sites-available/caidavzlabot — admin dashboard reverse proxy.
#
# Pegá este bloque DENTRO del `server { ... }` que ya sirve
# server.codeaver.com (el que tiene el cert TLS). Después:
#
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# El bot escucha en localhost:3000 (PORT env). Ajustá si usás otro.
# El path público debe coincidir con DASHBOARD_PATH del .env del bot
# (no hay rewrite — el path se pasa tal cual). En este ejemplo el bot
# tiene DASHBOARD_PATH=/caidavzlabot.
#
# IMPORTANTE: la cookie del dashboard tiene Secure=true, así que solo
# funciona vía HTTPS. Estás bien porque server.codeaver.com ya tiene TLS.

location /caidavzlabot/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Timeouts cortos — no hay endpoints long-running.
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # API es totalmente dinámica.
    add_header Cache-Control "no-store" always;
}

# /caidavzlabot (sin slash final) → redirige a /caidavzlabot/.
location = /caidavzlabot {
    return 301 /caidavzlabot/;
}
